name: CI

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.14"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Security scan
        run: python -m bandit -r src scripts -q
      - name: Test
        run: python -m pytest -q --cov=risk_lab --cov-report=term-missing
      - name: Pipeline smoke test
        run: python scripts/make_figures.py --scenarios 1000 --docs "${{ runner.temp }}/risk-lab-docs"
      - name: Extended analysis smoke test
        run: python scripts/make_extended_analysis.py --scenarios 1000 --docs "${{ runner.temp }}/risk-lab-extended"

  minimum:
    name: minimum dependencies / Python 3.12
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install minimum runtime versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "scipy==1.11.4" "pandas==2.1.4" "matplotlib==3.8.4"
          python -m pip install "pytest>=8" "pytest-cov>=5" "hypothesis>=6.100"
          python -m pip install -e . --no-deps
      - name: Test
        run: python -m pytest -q

  package:
    name: wheel / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps -w dist
      - name: Install the wheel
        run: |
          python -m pip install "numpy>=1.26" "scipy>=1.11" "pandas>=2.1" "matplotlib>=3.8"
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import risk_lab; print(risk_lab.__version__)"
          python -c "import importlib.resources as r; assert (r.files('risk_lab') / 'py.typed').is_file(); print('py.typed ok')"
