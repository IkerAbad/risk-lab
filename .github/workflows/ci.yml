name: CI

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.14"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Security scan
        run: python -m bandit -r src scripts -q
      - name: Test
        run: python -m pytest -q --cov=risk_lab --cov-report=term-missing
      - name: Pipeline smoke test
        run: python scripts/make_figures.py --scenarios 1000 --docs "${{ runner.temp }}/risk-lab-docs"
      - name: Extended analysis smoke test
        run: python scripts/make_extended_analysis.py --scenarios 1000 --docs "${{ runner.temp }}/risk-lab-extended"
